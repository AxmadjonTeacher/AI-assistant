<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swan Agent HUD</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    background: transparent !important;
    background-color: transparent !important;
    overflow: hidden !important;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    height: 100vh;
    width: 100vw;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    pointer-events: none !important;
  }

  .agent-capsule {
    position: relative;
    width: 242px;
    height: 44px;
    margin: 6px 10px 0 0;
    background: rgba(14, 15, 22, 0.94);
    -webkit-backdrop-filter: blur(30px);
    backdrop-filter: blur(30px);
    border-radius: 22px;
    border: 0.5px solid rgba(255, 255, 255, 0.16);
    box-shadow: inset 0 0.5px 0.5px rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    padding: 0 10px 0 12px;
    opacity: 0;
    transform: translateX(32px) scale(0.94);
    transition: 
      opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1), 
      transform 0.32s cubic-bezier(0.16, 1, 0.3, 1),
      border-color 0.25s ease;
    overflow: hidden;
    pointer-events: auto;
  }

  .agent-capsule.visible {
    opacity: 1;
    transform: translateX(0) scale(1);
  }

  /* Top Specular Rim Reflection */
  .agent-capsule::before {
    content: '';
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    pointer-events: none;
  }

  /* Swan Icon & Glow Aura */
  .icon-wrapper {
    position: relative;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 9px;
  }

  .glow-ring {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, rgba(59, 130, 246, 0.25) 60%, transparent 80%);
    filter: blur(3px);
    opacity: 0.75;
    animation: pulseRing 2.2s infinite ease-in-out;
  }

  @keyframes pulseRing {
    0% { transform: scale(0.85); opacity: 0.4; }
    50% { transform: scale(1.2); opacity: 0.85; }
    100% { transform: scale(0.85); opacity: 0.4; }
  }

  .swan-logo {
    width: 22px;
    height: 22px;
    object-fit: contain;
    position: relative;
    z-index: 2;
  }

  /* Content Text Area */
  .text-wrapper {
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-title {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.15px;
    color: #f8fafc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
  }

  .status-dot {
    width: 5.5px;
    height: 5.5px;
    border-radius: 50%;
    background: #a855f7;
    animation: blinkDot 1.4s infinite ease-in-out;
    flex-shrink: 0;
  }

  @keyframes blinkDot {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); }
  }

  .status-subtitle {
    font-size: 10px;
    font-weight: 400;
    color: rgba(226, 232, 240, 0.70);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  /* Stop Button */
  .stop-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    color: #f87171;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    flex-shrink: 0;
    margin-left: 8px;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
  }

  .stop-btn:hover {
    background: rgba(239, 68, 68, 0.24);
    border-color: rgba(239, 68, 68, 0.6);
    color: #ffffff;
    transform: scale(1.08);
  }

  .stop-btn:active {
    transform: scale(0.92);
  }

  .stop-icon {
    width: 8px;
    height: 8px;
    background: currentColor;
    border-radius: 1.5px;
  }

  /* Success State */
  .agent-capsule.completed {
    border-color: rgba(74, 222, 128, 0.40);
  }

  .agent-capsule.completed .glow-ring {
    background: radial-gradient(circle, rgba(74, 222, 128, 0.6) 0%, transparent 80%);
    animation: none;
    opacity: 0.8;
  }

  .agent-capsule.completed .status-dot {
    background: #4ade80;
    animation: none;
  }

  .agent-capsule.completed .stop-btn {
    display: none;
  }
</style>
</head>
<body>

<div id="agentCapsule" class="agent-capsule">
  <div class="icon-wrapper">
    <div id="glowRing" class="glow-ring"></div>
    <img src="swan_logo_transparent.png" class="swan-logo" alt="Swan Logo">
  </div>
  <div class="text-wrapper">
    <div class="title-row">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusTitle" class="status-title">Agent ishlamoqda...</span>
    </div>
    <div id="statusSubtitle" class="status-subtitle">Fon jarayoni</div>
  </div>
  <button id="btnStopAgent" class="stop-btn" title="Agentni to'xtatish" onclick="stopAgent(event)">
    <div class="stop-icon"></div>
  </button>
</div>

<script>
  const capsule = document.getElementById('agentCapsule');
  const statusTitle = document.getElementById('statusTitle');
  const statusSubtitle = document.getElementById('statusSubtitle');
  const glowRing = document.getElementById('glowRing');
  const btnStop = document.getElementById('btnStopAgent');

  function stopAgent(e) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    if (btnStop) {
      btnStop.style.opacity = '0.5';
      btnStop.disabled = true;
    }
    window.location.href = "swan://stopAgent";
  }

  function showWorking(title, subtitle) {
    statusTitle.textContent = title || "Agent ishlamoqda...";
    statusSubtitle.textContent = subtitle || "Fon jarayoni";
    if (btnStop) {
      btnStop.style.opacity = '1';
      btnStop.disabled = false;
      btnStop.style.display = 'flex';
    }
    capsule.classList.remove('completed');
    capsule.classList.add('visible');
  }

  function showCompleted(title, subtitle) {
    statusTitle.textContent = title || "Agent yakunlandi ✅";
    statusSubtitle.textContent = subtitle || "Vazifa muvaffaqiyatli bajarildi";
    if (btnStop) {
      btnStop.style.display = 'none';
    }
    capsule.classList.add('completed');
    capsule.classList.add('visible');
  }

  function hide() {
    capsule.classList.remove('visible');
  }
</script>
</body>
</html>
