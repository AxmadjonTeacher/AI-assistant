<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swan Independent Pointer Cursor</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }

  /* Overlay container */
  #overlay {
    position: relative;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Reticle / Sonar Ripple Anchor */
  .target-anchor {
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 9998;
  }

  .sonar-ring {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 50%;
    border: 2px solid rgba(56, 189, 248, 0.85);
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6), inset 0 0 8px rgba(139, 92, 246, 0.4);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .sonar-ring.active-1 {
    animation: sonarPulse 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
  }
  .sonar-ring.active-2 {
    animation: sonarPulse 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) 0.45s infinite;
  }
  .sonar-ring.active-3 {
    animation: sonarPulse 1.8s cubic-bezier(0.1, 0.8, 0.3, 1) 0.9s infinite;
  }

  @keyframes sonarPulse {
    0% {
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0.95;
      border-color: rgba(56, 189, 248, 0.95);
    }
    50% {
      opacity: 0.65;
    }
    100% {
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%) scale(1.6);
      opacity: 0;
      border-color: rgba(168, 85, 247, 0);
    }
  }

  /* Target Crosshair Dot */
  .target-dot {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 8px;
    background: #ffffff;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    box-shadow: 0 0 12px #38bdf8, 0 0 24px #818cf8;
    transition: transform 0.35s cubic-bezier(0.16, 1.08, 0.32, 1.02);
    pointer-events: none;
  }
  .target-dot.visible {
    transform: translate(-50%, -50%) scale(1);
  }

  /* Cyber Hand / Pointer Container */
  #cyber-hand {
    position: absolute;
    top: 0;
    left: 0;
    width: 140px;
    height: 140px;
    pointer-events: none;
    z-index: 9999;
    /* Fingertip offset inside SVG: fingertip is located at (18px, 16px) */
    margin-left: -18px;
    margin-top: -16px;
    transform: translate(50vw, -160px) scale(0.85);
    opacity: 0;
    transition: none;
    will-change: transform, opacity;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 18px rgba(56, 189, 248, 0.35));
  }

  /* Animated hovering state */
  #cyber-hand.hovering .hand-svg {
    animation: handBreathe 2.4s ease-in-out infinite alternate;
  }

  @keyframes handBreathe {
    0% {
      transform: translate(0, 0) rotate(0deg);
    }
    50% {
      transform: translate(2px, -3px) rotate(1deg);
    }
    100% {
      transform: translate(-1px, 2px) rotate(-0.5deg);
    }
  }

  /* Gentle tap gesture */
  #cyber-hand.tapping .hand-svg {
    animation: handTap 0.42s cubic-bezier(0.2, 0.9, 0.3, 1) 2;
  }

  @keyframes handTap {
    0% { transform: scale(1) translate(0, 0); }
    40% { transform: scale(0.92) translate(4px, 4px); }
    100% { transform: scale(1) translate(0, 0); }
  }

  /* Fingertip Luminous Laser Gem */
  .fingertip-emitter {
    position: absolute;
    left: 18px;
    top: 16px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 30%, #38bdf8 70%, #0284c7 100%);
    box-shadow: 0 0 10px #ffffff, 0 0 20px #38bdf8, 0 0 35px #0284c7;
    transform: translate(-50%, -50%);
    animation: emitterGlow 1.4s ease-in-out infinite alternate;
  }

  @keyframes emitterGlow {
    0% {
      transform: translate(-50%, -50%) scale(0.85);
      box-shadow: 0 0 8px #ffffff, 0 0 16px #38bdf8;
    }
    100% {
      transform: translate(-50%, -50%) scale(1.25);
      box-shadow: 0 0 14px #ffffff, 0 0 28px #38bdf8, 0 0 45px #3b82f6;
    }
  }

  /* Floating Info Tag */
  #pointer-tag {
    position: absolute;
    left: 80px;
    top: 75px;
    padding: 6px 14px;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 12px;
    color: #f8fafc;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(6px) scale(0.95);
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 14px rgba(56, 189, 248, 0.25);
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  #pointer-tag.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .tag-dot {
    width: 6px;
    height: 6px;
    background: #38bdf8;
    border-radius: 50%;
    box-shadow: 0 0 8px #38bdf8;
  }
</style>
</head>
<body>

<div id="overlay">
  <!-- Sonar Target Rings -->
  <div class="target-anchor" id="target-anchor">
    <div class="sonar-ring active-1" id="ring-1"></div>
    <div class="sonar-ring active-2" id="ring-2"></div>
    <div class="sonar-ring active-3" id="ring-3"></div>
    <div class="target-dot" id="target-dot"></div>
  </div>

  <!-- Cyber Hand Cursor -->
  <div id="cyber-hand">
    <div class="fingertip-emitter"></div>

    <!-- Futuristic Swan Hand SVG -->
    <svg class="hand-svg" width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="handBodyGrad" x1="20" y1="20" x2="110" y2="110" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#1e293b" />
          <stop offset="40%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <linearGradient id="cyberPlateGrad" x1="15" y1="15" x2="90" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="45%" stop-color="#818cf8" />
          <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>

        <linearGradient id="neonTrim" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>

        <linearGradient id="metalJointGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#94a3b8" />
          <stop offset="50%" stop-color="#475569" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <radialGradient id="swanOrb" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
          <stop offset="80%" stop-color="#0284c7" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
        </radialGradient>

        <!-- Specular Highlight -->
        <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
          <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <!-- Hand Shadow & Ambient Glow Base -->
      <path d="M 18,16 L 38,40 L 48,72 L 78,96 L 98,90 L 108,70 L 68,44 L 46,26 Z" fill="url(#cyberPlateGrad)" opacity="0.15" filter="blur(6px)" />

      <!-- Palm Chassis (Deep Obsidian Carbon) -->
      <path d="M 44,54 C 44,54 58,46 76,52 C 90,57 98,68 96,82 C 94,94 82,104 68,102 C 54,100 42,88 40,76 Z" 
            fill="url(#handBodyGrad)" stroke="url(#cyberPlateGrad)" stroke-width="1.8" />

      <!-- Palm Core Reactor (Swan Emblem Gem) -->
      <circle cx="68" cy="74" r="14" fill="#090d16" stroke="url(#neonTrim)" stroke-width="1.5" />
      <circle cx="68" cy="74" r="9" fill="url(#swanOrb)" />
      <!-- Swan Silhouette Inside Core -->
      <path d="M 64,76 C 65,71 67,69 70,69 C 72,69 73,70 72,72 C 70,73 68,75 67,77 L 73,77 C 73,78 71,80 68,80 C 65,80 64,78 64,76 Z" fill="#ffffff" opacity="0.9" />

      <!-- Folded Fingers (Middle, Ring, Pinky) -->
      <!-- Middle finger folded -->
      <path d="M 58,48 C 66,42 74,45 76,52 L 62,60 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <!-- Ring finger folded -->
      <path d="M 72,48 C 80,44 88,48 88,56 L 76,62 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <!-- Pinky finger folded -->
      <path d="M 84,54 C 92,50 98,56 96,64 L 86,68 Z" fill="#1e293b" stroke="#475569" stroke-width="1.2" />

      <!-- Thumb -->
      <path d="M 38,72 C 34,70 28,74 28,82 C 28,88 34,92 40,90 L 44,78 Z" 
            fill="url(#handBodyGrad)" stroke="url(#cyberPlateGrad)" stroke-width="1.4" />
      <!-- Thumb cyber segment -->
      <circle cx="34" cy="80" r="3" fill="url(#metalJointGrad)" />

      <!-- INDEX FINGER (The Primary Pointing Vector) -->
      <!-- Proximal Phalanx (Base) -->
      <path d="M 36,44 L 46,58 L 36,66 L 28,52 Z" fill="url(#handBodyGrad)" stroke="url(#cyberPlateGrad)" stroke-width="1.4" />
      <circle cx="37" cy="54" r="3.5" fill="url(#metalJointGrad)" stroke="#38bdf8" stroke-width="0.8" />

      <!-- Intermediate Phalanx (Shaft) -->
      <path d="M 28,34 L 38,46 L 30,52 L 20,40 Z" fill="url(#handBodyGrad)" stroke="url(#cyberPlateGrad)" stroke-width="1.4" />
      <!-- Glowing circuit line down index finger -->
      <line x1="24" y1="36" x2="33" y2="48" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Distal Phalanx & Precision Tip -->
      <!-- Points directly toward (18, 16) -->
      <path d="M 18,16 L 28,32 C 28,32 24,38 18,36 L 14,24 Z" 
            fill="url(#cyberPlateGrad)" stroke="#ffffff" stroke-width="1.2" />
      <!-- Sleek fingertip stylus shell -->
      <path d="M 18,16 L 22,24 L 16,26 Z" fill="#ffffff" opacity="0.95" />
      <circle cx="23" cy="34" r="2.8" fill="url(#metalJointGrad)" stroke="#818cf8" stroke-width="0.8" />

      <!-- Glint Highlight on Pointer Edge -->
      <path d="M 18,16 L 28,34" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    </svg>

    <!-- Floating text label -->
    <div id="pointer-tag">
      <span class="tag-dot"></span>
      <span id="pointer-tag-text">Target</span>
    </div>
  </div>
</div>

<script>
  const hand = document.getElementById('cyber-hand');
  const targetAnchor = document.getElementById('target-anchor');
  const targetDot = document.getElementById('target-dot');
  const tag = document.getElementById('pointer-tag');
  const tagText = document.getElementById('pointer-tag-text');

  let activeTimer = null;
  let animationFrameId = null;

  // Spring physics engine
  let currentX = window.innerWidth / 2;
  let currentY = -160;
  let targetX = window.innerWidth / 2;
  let targetY = -160;
  let vx = 0;
  let vy = 0;
  let isRetracting = true;

  const springK = 0.14;   // stiffness
  const damping = 0.76;   // damping

  function updatePhysics() {
    const ax = (targetX - currentX) * springK;
    const ay = (targetY - currentY) * springK;

    vx = (vx + ax) * damping;
    vy = (vy + ay) * damping;

    currentX += vx;
    currentY += vy;

    // Apply transform to hand
    hand.style.transform = `translate(${currentX}px, ${currentY}px)`;

    const dist = Math.hypot(targetX - currentX, targetY - currentY);
    const speed = Math.hypot(vx, vy);

    if (dist < 0.5 && speed < 0.2) {
      currentX = targetX;
      currentY = targetY;
      vx = 0;
      vy = 0;
      if (isRetracting) {
        hand.style.opacity = '0';
        hand.classList.remove('hovering');
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        return;
      }
    }

    animationFrameId = requestAnimationFrame(updatePhysics);
  }

  function startPhysicsLoop() {
    if (!animationFrameId) {
      animationFrameId = requestAnimationFrame(updatePhysics);
    }
  }

  /**
   * Slides the hand from the top bezel notch down to (x, y).
   * @param {number} x - Target screen X in CSS pixels
   * @param {number} y - Target screen Y in CSS pixels
   * @param {number} duration - Duration to point in seconds (default 3.8s)
   * @param {string} action - 'point', 'tap', or 'circle'
   * @param {string} label - Optional text label chip
   */
  window.pointAt = function(x, y, duration = 3.8, action = 'point', label = '') {
    if (activeTimer) {
      clearTimeout(activeTimer);
      activeTimer = null;
    }

    isRetracting = false;

    // If starting from retracted state, start from top notch
    if (parseFloat(hand.style.opacity || '0') < 0.1) {
      currentX = window.innerWidth / 2;
      currentY = -150;
      vx = 0;
      vy = 12; // downward initial impulse
    }

    targetX = x;
    targetY = y;

    hand.style.opacity = '1';
    hand.classList.remove('tapping');
    hand.classList.add('hovering');

    // Position reticle anchor
    targetAnchor.style.left = `${x}px`;
    targetAnchor.style.top = `${y}px`;
    targetDot.classList.add('visible');

    // Handle tag label
    if (label && label.trim().length > 0) {
      tagText.textContent = label.trim();
      tag.classList.add('visible');
    } else {
      tag.classList.remove('visible');
    }

    // Action handling
    if (action === 'tap') {
      setTimeout(() => {
        hand.classList.add('tapping');
      }, 550);
    }

    startPhysicsLoop();

    // Auto retract after duration
    activeTimer = setTimeout(() => {
      window.retract();
    }, duration * 1000);
  };

  /**
   * Smoothly glides the hand back up into the top bezel notch.
   */
  window.retract = function() {
    if (activeTimer) {
      clearTimeout(activeTimer);
      activeTimer = null;
    }

    isRetracting = true;
    targetX = window.innerWidth / 2;
    targetY = -170; // Behind top bezel

    targetDot.classList.remove('visible');
    tag.classList.remove('visible');
    hand.classList.remove('hovering', 'tapping');

    startPhysicsLoop();
  };

  // Resize handler
  window.addEventListener('resize', () => {
    if (isRetracting) {
      targetX = window.innerWidth / 2;
    }
  });
</script>
</body>
</html>
