<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swan Intelligence Report</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: text;
    -webkit-user-select: text;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent !important;
    background-color: transparent !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    color: rgba(255, 255, 255, 0.88);
    -webkit-font-smoothing: antialiased;
  }

  /* macOS Sequoia Frosted Obsidian Glass Container */
  .report-panel {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(18, 18, 24, 0.75);
    backdrop-filter: blur(50px) saturate(200%);
    -webkit-backdrop-filter: blur(50px) saturate(200%);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    box-shadow: 
      0 24px 64px -8px rgba(0, 0, 0, 0.60),
      0 8px 24px -4px rgba(0, 0, 0, 0.40),
      inset 0 0.5px 0 0 rgba(255, 255, 255, 0.18);
    overflow: hidden;
    animation: panelPopIn 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes panelPopIn {
    0% {
      opacity: 0;
      transform: scale(0.97) translateX(-12px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateX(0);
    }
  }

  /* Window Title / Drag Header */
  .panel-header {
    height: 46px;
    min-height: 46px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.02);
    -webkit-app-region: drag;
    user-select: none;
    -webkit-user-select: none;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    -webkit-app-region: no-drag;
  }

  /* Minimalist SF Symbol Close Button */
  .btn-close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 0.5px solid rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-close:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
    border-color: rgba(255, 255, 255, 0.22);
  }
  .btn-close:active {
    transform: scale(0.92);
  }

  /* Source Intelligence Badge with Apple Intelligence Sparkle Glyph */
  .brand-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    background: rgba(255, 255, 255, 0.05);
    border: 0.5px solid rgba(255, 255, 255, 0.10);
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.72);
    letter-spacing: -0.1px;
  }
  .source-svg {
    width: 11px;
    height: 11px;
    fill: currentColor;
    color: rgba(255, 255, 255, 0.65);
  }

  .header-center {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: -0.1px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    max-width: 190px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }

  /* SF Symbol Copy Button */
  .btn-copy {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: -0.1px;
    cursor: pointer;
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-copy:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.22);
    color: #FFFFFF;
  }
  .btn-copy:active {
    transform: scale(0.94);
  }
  .btn-copy.copied {
    background: rgba(48, 209, 88, 0.14);
    border-color: rgba(48, 209, 88, 0.35);
    color: #30D158;
  }

  /* Scrollable Body Content */
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Native macOS Overlay Scrollbar */
  .panel-body::-webkit-scrollbar {
    width: 5px;
  }
  .panel-body::-webkit-scrollbar-track {
    background: transparent;
  }
  .panel-body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
  }
  .panel-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  /* Document Typography */
  .doc-title {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    color: #FFFFFF;
    letter-spacing: -0.4px;
  }

  /* Inline Typographic Metadata (Zero Emojis) */
  .meta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.40);
    letter-spacing: -0.05px;
    padding-bottom: 12px;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
  }
  .meta-sep {
    font-size: 8px;
    opacity: 0.4;
  }

  /* Markdown Typography & Hierarchies */
  .markdown-body {
    font-size: 13px;
    line-height: 1.62;
    color: rgba(255, 255, 255, 0.82);
  }

  .markdown-body h1 {
    font-size: 16px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: -0.3px;
    margin: 18px 0 8px 0;
    padding-bottom: 4px;
    border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
  }
  .markdown-body h2 {
    font-size: 14.5px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.94);
    letter-spacing: -0.2px;
    margin: 16px 0 6px 0;
  }
  .markdown-body h3 {
    font-size: 13.5px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    margin: 14px 0 4px 0;
  }
  .markdown-body p {
    margin-bottom: 11px;
  }
  .markdown-body ul, .markdown-body ol {
    margin: 6px 0 12px 20px;
  }
  .markdown-body li {
    margin-bottom: 5px;
  }
  .markdown-body strong {
    color: #FFFFFF;
    font-weight: 600;
  }
  .markdown-body em {
    color: rgba(255, 255, 255, 0.70);
  }
  .markdown-body blockquote {
    margin: 12px 0;
    padding: 8px 14px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 4px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 12.5px;
  }
  .markdown-body pre {
    margin: 12px 0;
    padding: 12px 14px;
    background: rgba(0, 0, 0, 0.45);
    border: 0.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.90);
  }
  .markdown-body code {
    background: rgba(255, 255, 255, 0.07);
    padding: 2px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.90);
  }
  .markdown-body pre code {
    background: transparent;
    padding: 0;
    color: inherit;
  }
  .markdown-body hr {
    border: none;
    height: 0.5px;
    background: rgba(255, 255, 255, 0.08);
    margin: 16px 0;
  }
</style>
</head>
<body>

<div class="report-panel" id="panel">
  <!-- Header / Window Controls -->
  <div class="panel-header">
    <div class="header-left">
      <!-- SF Symbol: xmark -->
      <button class="btn-close" id="btn-close" title="Close Window" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M1.5 1.5L8.5 8.5M8.5 1.5L1.5 8.5"/>
        </svg>
      </button>

      <!-- Source Badge with Apple Intelligence Sparkle Glyph -->
      <div class="brand-badge" id="source-badge">
        <svg class="source-svg" viewBox="0 0 16 16">
          <path d="M8 0.5C8 4.64 4.64 8 0.5 8C4.64 8 8 11.36 8 15.5C8 11.36 11.36 8 15.5 8C11.36 8 8 4.64 8 0.5Z"/>
        </svg>
        <span id="source-label">Research Agent</span>
      </div>
    </div>

    <div class="header-center" id="header-subtitle">Intelligence Report</div>

    <div class="header-actions">
      <!-- SF Symbol: doc.on.doc -->
      <button class="btn-copy" id="btn-copy" title="Copy Content">
        <svg class="copy-icon" id="copy-icon-svg" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.5" y="5.5" width="8" height="8" rx="2"/>
          <path d="M3.5 10.5H2.5C1.94772 10.5 1.5 10.0523 1.5 9.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H9.5C10.0523 1.5 10.5 1.94772 10.5 2.5V3.5"/>
        </svg>
        <span id="copy-text">Copy</span>
      </button>
    </div>
  </div>

  <!-- Scrollable Report Body -->
  <div class="panel-body">
    <h1 class="doc-title" id="report-title">Research Summary</h1>
    
    <!-- Clean Typographic Metadata Row (Zero Emojis) -->
    <div class="meta-row">
      <span id="meta-time">Just now</span>
      <span class="meta-sep">&bull;</span>
      <span id="meta-words">0 words</span>
      <span class="meta-sep">&bull;</span>
      <span id="meta-tier">Swan Intelligence</span>
    </div>

    <div class="markdown-body" id="report-content">
      <!-- Dynamically populated formatted markdown content -->
    </div>
  </div>
</div>

<script>
  let rawContentText = "";

  function parseMarkdown(md) {
    if (!md) return "";
    let html = md
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Code blocks
    html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headers
    html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');

    // Blockquotes
    html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');

    // Bold & Italics
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Horizontal Rule
    html = html.replace(/^---$/gim, '<hr>');

    // Unordered Lists
    html = html.replace(/^\s*[-*]\s+(.*)$/gim, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>)/gms, '<ul>$1</ul>');
    html = html.replace(/<\/ul>\s*<ul>/g, '');

    // Paragraphs
    const lines = html.split('\n');
    const finalLines = [];

    for (let line of lines) {
      const trimmed = line.trim();
      if (!trimmed) {
        finalLines.push('');
        continue;
      }
      if (trimmed.startsWith('<h') || trimmed.startsWith('<pre') || trimmed.startsWith('<blockquote') || trimmed.startsWith('<ul') || trimmed.startsWith('<li') || trimmed.startsWith('<hr')) {
        finalLines.push(trimmed);
      } else {
        finalLines.push(`<p>${trimmed}</p>`);
      }
    }

    return finalLines.join('\n');
  }

  window.setReport = function(title, content, source) {
    rawContentText = content || "";
    document.getElementById('report-title').textContent = title || "Report";
    document.getElementById('source-label').textContent = source || "Swan Agent";
    document.getElementById('header-subtitle').textContent = (title || "").slice(0, 26);

    const now = new Date();
    document.getElementById('meta-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const words = rawContentText.split(/\s+/).filter(Boolean).length;
    document.getElementById('meta-words').textContent = `${words} words`;

    document.getElementById('report-content').innerHTML = parseMarkdown(rawContentText);
  };

  // Close Button Handler
  document.getElementById('btn-close').addEventListener('click', () => {
    window.location.href = "swan://closeWindow";
  });

  // SF Symbols Doc-on-Doc vs Checkmark SVGs
  const svgDocOnDoc = `
    <rect x="5.5" y="5.5" width="8" height="8" rx="2"/>
    <path d="M3.5 10.5H2.5C1.94772 10.5 1.5 10.0523 1.5 9.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H9.5C10.0523 1.5 10.5 1.94772 10.5 2.5V3.5"/>
  `;
  const svgCheckmark = `
    <path d="M3 8.5L6 11.5L13 4.5" stroke-width="1.6"/>
  `;

  // Copy Button Handler
  document.getElementById('btn-copy').addEventListener('click', () => {
    const copyText = `# ${document.getElementById('report-title').textContent}\n\n${rawContentText}`;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(copyText);
    }
    window.location.href = "swan://copyContent";

    const btn = document.getElementById('btn-copy');
    const label = document.getElementById('copy-text');
    const iconSvg = document.getElementById('copy-icon-svg');

    btn.classList.add('copied');
    label.textContent = "Copied";
    iconSvg.innerHTML = svgCheckmark;

    setTimeout(() => {
      btn.classList.remove('copied');
      label.textContent = "Copy";
      iconSvg.innerHTML = svgDocOnDoc;
    }, 2000);
  });
</script>
</body>
</html>
