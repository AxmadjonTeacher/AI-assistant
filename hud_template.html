<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swan Apple Dynamic Island HUD</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none !important;
    cursor: default !important;
  }

  html, body {
    background: transparent !important;
    background-color: transparent !important;
    overflow: hidden !important;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    width: 100vw;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    pointer-events: none !important;
    cursor: default !important;
  }

  /* Dynamic Island Container - Apple Jet Black with Fluid Spring Morphing */
  .dynamic-island {
    position: relative;
    width: 440px;
    height: 48px;
    background: #000000;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    box-sizing: border-box;
    opacity: 0;
    transform: translateY(-100%);
    will-change: width, height, transform, opacity;
    
    /* Apple Hairline Specular Edge (bottom and sides only, flush with bezel) */
    box-shadow: 
      0 16px 36px -4px rgba(0, 0, 0, 0.85),
      0 6px 14px -2px rgba(0, 0, 0, 0.65),
      0 0 0 0.5px rgba(255, 255, 255, 0.16);
      
    /* Apple Spring Transition for morphing between states */
    transition: 
      width 0.44s cubic-bezier(0.16, 1, 0.3, 1),
      height 0.44s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.42s cubic-bezier(0.16, 1.08, 0.32, 1.02),
      opacity 0.22s ease-out,
      border-color 0.35s ease,
      box-shadow 0.35s ease;
  }

  .dynamic-island.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Concave Ear Wings connecting flush to MacBook screen bezel / notch */
  .dynamic-island::before {
    content: '';
    position: absolute;
    top: 0;
    left: -12px;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 0% 100%, transparent 12px, #000000 12.5px);
    pointer-events: none;
  }

  .dynamic-island::after {
    content: '';
    position: absolute;
    top: 0;
    right: -12px;
    width: 12px;
    height: 12px;
    background: radial-gradient(circle at 100% 100%, transparent 12px, #000000 12.5px);
    pointer-events: none;
  }

  /* Specular Glass Sheen Overlay */
  .specular-gloss {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 55%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 65%, transparent 100%);
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* Swan App Crystal Badge */
  .swan-logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 0.5px solid rgba(255, 255, 255, 0.24);
    box-shadow: 
      inset 0 1px 1.5px rgba(255, 255, 255, 0.3),
      0 2px 6px rgba(0, 0, 0, 0.45);
    z-index: 2;
    transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .swan-crystal-logo {
    width: 19px;
    height: 20px;
    object-fit: contain;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
  }

  /* Speech Bubble (Waveform Pill) */
  .speech-bubble {
    position: relative;
    flex: 1;
    height: 28px;
    margin: 0 10px;
    background: rgba(18, 18, 22, 0.72);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    box-shadow: 
      inset 0 1px 2.5px rgba(0, 0, 0, 0.65), 
      inset 0 0 8px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Dynamic Island Status Badge */
  .status-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    max-width: 130px;
    height: 28px;
    padding: 0 2px;
    z-index: 2;
  }

  .status-dot {
    width: 6.5px;
    height: 6.5px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    flex-shrink: 0;
    animation: statusPulse 2s infinite ease-in-out;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  @keyframes statusPulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px rgba(255, 255, 255, 1); }
  }

  .status-text-col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .status-label {
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .status-sub {
    font-size: 10px;
    font-weight: 400;
    color: #8E8E93;
    letter-spacing: 0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  .status-sub.visible {
    display: block;
  }

  /* --- APPLE DYNAMIC ISLAND STATES --- */

  /* State: Wake / Listening */
  .state-listening.dynamic-island, .state-wake.dynamic-island {
    width: 440px;
    height: 48px;
    box-shadow: 
      0 16px 36px -4px rgba(0, 0, 0, 0.85),
      0 0 0 0.5px rgba(56, 189, 248, 0.3),
      0 0 16px -4px rgba(10, 132, 255, 0.25);
  }
  .state-listening .status-dot, .state-wake .status-dot {
    background: #30D158;
    box-shadow: 0 0 10px #30D158;
  }
  .state-listening .speech-bubble, .state-wake .speech-bubble {
    border-color: rgba(48, 209, 88, 0.25);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(48, 209, 88, 0.15);
  }

  /* State: Thinking */
  .state-thinking.dynamic-island {
    width: 330px;
    height: 44px;
    box-shadow: 
      0 16px 36px -4px rgba(0, 0, 0, 0.85),
      0 0 0 0.5px rgba(191, 90, 242, 0.35),
      0 0 18px -4px rgba(191, 90, 242, 0.3);
  }
  .state-thinking .status-dot {
    background: #BF5AF2;
    box-shadow: 0 0 10px #BF5AF2;
  }
  .state-thinking .speech-bubble {
    border-color: rgba(191, 90, 242, 0.25);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(191, 90, 242, 0.2);
  }

  /* State: Speaking */
  .state-speaking.dynamic-island {
    width: 500px;
    height: 50px;
    box-shadow: 
      0 18px 40px -4px rgba(0, 0, 0, 0.9),
      0 0 0 0.5px rgba(255, 255, 255, 0.24),
      0 0 20px -4px rgba(191, 90, 242, 0.3);
  }
  .state-speaking .swan-logo-badge {
    transform: scale(1.06);
    border-color: rgba(255, 255, 255, 0.4);
  }
  .state-speaking .status-dot {
    background: #FFFFFF;
    box-shadow: 0 0 10px #FFFFFF, 0 0 14px rgba(191, 90, 242, 0.9);
  }
  .state-speaking .speech-bubble {
    border-color: rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(10, 132, 255, 0.15);
  }

  /* State: Action */
  .state-action.dynamic-island {
    width: 430px;
    height: 48px;
    box-shadow: 
      0 16px 36px -4px rgba(0, 0, 0, 0.85),
      0 0 0 0.5px rgba(10, 132, 255, 0.35),
      0 0 16px -4px rgba(10, 132, 255, 0.25);
  }
  .state-action .status-dot {
    background: #0A84FF;
    box-shadow: 0 0 10px #0A84FF;
  }
  .state-action .speech-bubble {
    border-color: rgba(10, 132, 255, 0.25);
  }
</style>
</head>

  <!-- Center: Siri Waveform Capsule -->
  <div class="speech-bubble">
    <canvas id="waveCanvas"></canvas>
  </div>

  <!-- Right: Apple Status Badge -->
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <div class="status-text-col">
      <span class="status-label" id="statusLabel">Ready</span>
      <span class="status-sub" id="statusSub"></span>
    </div>
  </div>
</div>

<script>
  const hud = document.getElementById('hud');
  const statusLabel = document.getElementById('statusLabel');
  const statusSub = document.getElementById('statusSub');
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');

  let width = 240, height = 28;
  function resize() {
    if (canvas && canvas.parentElement) {
      const pW = canvas.parentElement.clientWidth;
      const pH = canvas.parentElement.clientHeight;
      width = pW > 20 ? pW : 240;
      height = pH > 10 ? pH : 28;
      const dpr = window.devicePixelRatio || 2;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
  }
  window.addEventListener('resize', resize);
  setTimeout(resize, 60);

  let audioEnergy = 0.08;
  let targetEnergy = 0.08;
  let phase = 0;
  let currentState = 'idle';

  function setAudioEnergy(energy) {
    targetEnergy = Math.max(0.06, Math.min(1.0, energy * 4.2));
  }

  function formatLabel(state, labelStr) {
    if (labelStr && labelStr.trim()) return labelStr.trim();
    switch (state) {
      case 'listening': return 'Listening...';
      case 'thinking': return 'Thinking...';
      case 'action': return 'Executing...';
      case 'speaking': return 'Speaking';
      case 'wake': return 'Ready';
      default: return 'Ready';
    }
  }

  function setState(state, statusStr, subtitleStr) {
    currentState = state;
    if (state === 'idle') {
      hud.classList.remove('visible');
      hud.className = 'dynamic-island state-idle';
      return;
    }
    hud.className = 'dynamic-island visible state-' + state;
    setTimeout(resize, 180); // Adjust canvas dimensions dynamically as Dynamic Island morphs

    const targetText = formatLabel(state, statusStr || subtitleStr);
    if (statusLabel && statusLabel.textContent !== targetText) {
      statusLabel.style.opacity = '0';
      statusLabel.style.transform = 'translateY(2px)';
      setTimeout(() => {
        statusLabel.textContent = targetText;
        statusLabel.style.opacity = '1';
        statusLabel.style.transform = 'translateY(0)';
      }, 120);
    }

    if (statusSub) {
      if (subtitleStr && subtitleStr !== targetText && subtitleStr.trim().length > 0) {
        statusSub.textContent = subtitleStr.trim();
        statusSub.classList.add('visible');
      } else {
        statusSub.classList.remove('visible');
      }
    }
  }

  function showHUD(state, statusStr, subtitleStr) {
    if (state === 'idle') return;
    resize();
    setState(state, statusStr, subtitleStr);
    hud.classList.add('visible');
  }

  function hideHUD() {
    currentState = 'idle';
    hud.classList.remove('visible');
    hud.className = 'dynamic-island state-idle';
  }

  window.setAudioEnergy = setAudioEnergy;
  window.setState = setState;
  window.showHUD = showHUD;
  window.hideHUD = hideHUD;

  // --- APPLE SIRI FLUID HARMONIC WAVE DRAWING ---
  function drawFluidRibbon(t, yOffset, amplitude, frequency, fillStyle, composite = 'source-over') {
    ctx.save();
    ctx.globalCompositeOperation = composite;
    ctx.beginPath();
    ctx.moveTo(0, height / 2);

    const midY = height / 2 + yOffset;
    for (let x = 0; x <= width; x += 2) {
      const nx = (x / width) * 2 - 1;
      const envelope = Math.exp(-2.5 * (nx * nx));

      const w1 = Math.sin(x * frequency + t) * amplitude;
      const w2 = Math.cos(x * (frequency * 1.5) - t * 0.7) * (amplitude * 0.4);
      const w3 = Math.sin(x * (frequency * 0.55) + t * 1.25) * (amplitude * 0.2);
      const y = midY + (w1 + w2 + w3) * envelope;

      ctx.lineTo(x, y);
    }

    ctx.lineTo(width, height);
    ctx.lineTo(0, height);
    ctx.closePath();

    ctx.fillStyle = fillStyle;
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    audioEnergy += (targetEnergy - audioEnergy) * 0.18;
    phase += (0.045 + audioEnergy * 0.08) * 1.0;

    ctx.clearRect(0, 0, width, height);

    const isThinking = currentState === 'thinking';
    const isListening = currentState === 'listening' || currentState === 'wake';
    const isAction = currentState === 'action';

    const thinkingAmp = isThinking ? Math.sin(phase * 1.8) * 3.2 : 0;
    const basePulse = Math.sin(phase * 0.85) * 1.8 + Math.cos(phase * 1.25) * 0.9;
    const amp = Math.max(3.0, (4.5 + basePulse + audioEnergy * 22.0 + thinkingAmp));

    if (isThinking) {
      // Siri Purple / Indigo Synaptic Breathing Wave
      const grad1 = ctx.createLinearGradient(0, 0, width, 0);
      grad1.addColorStop(0, 'rgba(94, 92, 230, 0.45)');
      grad1.addColorStop(0.5, 'rgba(191, 90, 242, 0.7)');
      grad1.addColorStop(1, 'rgba(94, 92, 230, 0.45)');
      drawFluidRibbon(phase * 1.2, 0, amp * 0.9, 0.038, grad1);

      const grad2 = ctx.createLinearGradient(0, 0, width, 0);
      grad2.addColorStop(0, 'rgba(191, 90, 242, 0.5)');
      grad2.addColorStop(0.5, 'rgba(235, 235, 245, 0.8)');
      grad2.addColorStop(1, 'rgba(191, 90, 242, 0.5)');
      drawFluidRibbon(-phase * 1.4, 0, amp * 1.1, 0.052, grad2, 'screen');
    } else if (isListening) {
      // Siri Neon Cyan + Emerald Green Reactive Mic Wave
      const grad1 = ctx.createLinearGradient(0, 0, width, 0);
      grad1.addColorStop(0, 'rgba(10, 132, 255, 0.45)');
      grad1.addColorStop(0.5, 'rgba(48, 209, 88, 0.7)');
      grad1.addColorStop(1, 'rgba(10, 132, 255, 0.45)');
      drawFluidRibbon(phase * 1.0, 0, amp * 0.9, 0.036, grad1);

      const grad2 = ctx.createLinearGradient(0, 0, width, 0);
      grad2.addColorStop(0, 'rgba(48, 209, 88, 0.5)');
      grad2.addColorStop(0.5, 'rgba(56, 189, 248, 0.8)');
      grad2.addColorStop(1, 'rgba(48, 209, 88, 0.5)');
      drawFluidRibbon(-phase * 1.2, 0, amp * 1.15, 0.048, grad2, 'screen');
    } else if (isAction) {
      // Electric Cyber Azure + Amber Shimmer
      const grad1 = ctx.createLinearGradient(0, 0, width, 0);
      grad1.addColorStop(0, 'rgba(10, 132, 255, 0.5)');
      grad1.addColorStop(0.5, 'rgba(255, 159, 10, 0.7)');
      grad1.addColorStop(1, 'rgba(10, 132, 255, 0.5)');
      drawFluidRibbon(phase * 1.2, 0, amp * 0.9, 0.04, grad1);

      const grad2 = ctx.createLinearGradient(0, 0, width, 0);
      grad2.addColorStop(0, 'rgba(56, 189, 248, 0.6)');
      grad2.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
      grad2.addColorStop(1, 'rgba(56, 189, 248, 0.6)');
      drawFluidRibbon(-phase * 1.3, 0, amp * 1.1, 0.05, grad2, 'screen');
    } else {
      // Speaking: Full Apple Siri 4-Color Harmonic Symphony
      // Layer 1: Siri Azure (#0A84FF)
      const grad1 = ctx.createLinearGradient(0, 0, width, 0);
      grad1.addColorStop(0, 'rgba(10, 132, 255, 0.45)');
      grad1.addColorStop(0.5, 'rgba(56, 189, 248, 0.65)');
      grad1.addColorStop(1, 'rgba(10, 132, 255, 0.45)');
      drawFluidRibbon(phase * 0.88, 0, amp * 0.85, 0.034, grad1);

      // Layer 2: Apple Emerald (#30D158)
      const grad2 = ctx.createLinearGradient(0, 0, width, 0);
      grad2.addColorStop(0, 'rgba(48, 209, 88, 0.5)');
      grad2.addColorStop(0.5, 'rgba(52, 211, 153, 0.7)');
      grad2.addColorStop(1, 'rgba(48, 209, 88, 0.5)');
      drawFluidRibbon(-phase * 1.15 + 1.2, 0, amp * 1.05, 0.044, grad2, 'screen');

      // Layer 3: Siri Violet (#BF5AF2)
      const grad3 = ctx.createLinearGradient(0, 0, width, 0);
      grad3.addColorStop(0, 'rgba(191, 90, 242, 0.55)');
      grad3.addColorStop(0.5, 'rgba(235, 235, 255, 0.8)');
      grad3.addColorStop(1, 'rgba(191, 90, 242, 0.55)');
      drawFluidRibbon(phase * 1.35 + 2.8, 0, amp * 1.18, 0.054, grad3, 'screen');

      // Layer 4: Sunset Magenta (#FF375F)
      const grad4 = ctx.createLinearGradient(0, 0, width, 0);
      grad4.addColorStop(0, 'rgba(255, 55, 95, 0.4)');
      grad4.addColorStop(0.5, 'rgba(244, 63, 94, 0.65)');
      grad4.addColorStop(1, 'rgba(255, 55, 95, 0.4)');
      drawFluidRibbon(-phase * 0.95 + 4.1, 0, amp * 0.75, 0.048, grad4, 'screen');
    }

    // Luminous White Crest Highlight
    ctx.save();
    ctx.beginPath();
    const midY = height / 2;
    for (let x = 0; x <= width; x += 2) {
      const nx = (x / width) * 2 - 1;
      const envelope = Math.exp(-2.5 * (nx * nx));
      const w1 = Math.sin(x * 0.054 + phase * 1.35 + 2.8) * (amp * 1.18);
      const w2 = Math.cos(x * 0.085 - phase * 0.95) * (amp * 0.28);
      const y = midY + (w1 + w2) * envelope;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.96)';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = '#FFFFFF';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();

    requestAnimationFrame(animate);
  }

  animate();
</script>
